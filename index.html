<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyGPT</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #20242a;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .workspace {
      display: grid;
      gap: 14px;
    }

    .mode-switch {
      display: inline-flex;
      width: fit-content;
      border: 1px solid #cdd3dc;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .mode-button {
      height: 38px;
      border: 0;
      border-radius: 0;
      padding: 0 16px;
      background: transparent;
      color: #374151;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }

    .mode-button.active {
      background: #1f6feb;
      color: #fff;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cdd3dc;
      border-radius: 8px;
      color: #181b20;
      background: #fff;
      outline: none;
    }

    textarea {
      min-height: 52vh;
      resize: vertical;
      padding: 16px;
      font: 16px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    input[type="text"] {
      height: 40px;
      padding: 0 12px;
      font-size: 15px;
    }

    textarea:focus,
    input[type="text"]:focus {
      border-color: #2f6feb;
      box-shadow: 0 0 0 3px rgba(47, 111, 235, 0.14);
    }

    .hidden {
      display: none !important;
    }

    .chat-panel {
      display: grid;
      gap: 12px;
    }

    .chat-log {
      min-height: 46vh;
      max-height: 58vh;
      overflow: auto;
      border: 1px solid #cdd3dc;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      box-sizing: border-box;
    }

    .message {
      display: grid;
      gap: 5px;
      margin: 0 0 14px;
    }

    .message:last-child {
      margin-bottom: 0;
    }

    .role {
      color: #69717d;
      font-size: 13px;
      font-weight: 700;
    }

    .bubble {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-radius: 8px;
      padding: 10px 12px;
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .user .bubble {
      background: #edf4ff;
    }

    .assistant .bubble {
      background: #f1f3f5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    button {
      height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      background: #1f6feb;
      color: white;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      background: #9aa7b5;
      cursor: wait;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #3e4650;
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="number"] {
      width: 76px;
      height: 34px;
      box-sizing: border-box;
      border: 1px solid #cdd3dc;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 14px;
      background: white;
    }

    .status {
      min-height: 22px;
      color: #5b6572;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>TinyGPT</h1>
    <section class="workspace">
      <div class="mode-switch" role="tablist" aria-label="生成模式">
        <button id="continueModeButton" class="mode-button active" type="button" role="tab" aria-selected="true">续写模式</button>
        <button id="chatModeButton" class="mode-button" type="button" role="tab" aria-selected="false">对话模式</button>
      </div>

      <div id="continuePanel">
        <textarea id="prompt" spellcheck="false" placeholder="写一段话，然后点击续写。"></textarea>
      </div>

      <div id="chatPanel" class="chat-panel hidden">
        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <input id="systemPrompt" type="text" value="You are a helpful dialogue agent. Respond naturally across the full conversation." aria-label="system prompt">
        <textarea id="chatInput" spellcheck="false" placeholder="输入消息，然后点击发送。"></textarea>
      </div>

      <div class="controls">
        <button id="generateButton" type="button">续写</button>
        <label>生成 token <input id="maxTokens" type="number" min="1" max="300" value="80"></label>
        <label>temperature <input id="temperature" type="number" min="0.1" max="2" step="0.1" value="0.9"></label>
        <label>top-k <input id="topK" type="number" min="0" max="200" step="1" value="50"></label>
        <label id="historyTurnsLabel" class="hidden">历史轮数 <input id="historyTurns" type="number" min="0" max="20" step="1" value="4"></label>
        <button id="clearChatButton" class="hidden" type="button">清空对话</button>
      </div>
      <div id="status" class="status">等待加载模型...</div>
    </section>
  </main>

  <script>
    function assetUrl(name, fallback) {
      const value = new URLSearchParams(location.search).get(name);
      return value && value.trim() ? value.trim() : fallback;
    }

    const MODEL_URL = assetUrl("model", "https://huggingface.co/BoiWanKenobi/myNovelGPT/resolve/main/tinygpt.onnx");
    const METADATA_URL = assetUrl("metadata", "https://huggingface.co/BoiWanKenobi/myNovelGPT/resolve/main/tinygpt.onnx.json");
    const TOKENIZER_URL = assetUrl("tokenizer", "https://huggingface.co/BoiWanKenobi/myNovelGPT/resolve/main/params/tokenizer2.json");

    const promptEl = document.getElementById("prompt");
    const continuePanelEl = document.getElementById("continuePanel");
    const chatPanelEl = document.getElementById("chatPanel");
    const continueModeButtonEl = document.getElementById("continueModeButton");
    const chatModeButtonEl = document.getElementById("chatModeButton");
    const buttonEl = document.getElementById("generateButton");
    const chatLogEl = document.getElementById("chatLog");
    const chatInputEl = document.getElementById("chatInput");
    const systemPromptEl = document.getElementById("systemPrompt");
    const clearChatButtonEl = document.getElementById("clearChatButton");
    const historyTurnsEl = document.getElementById("historyTurns");
    const historyTurnsLabelEl = document.getElementById("historyTurnsLabel");
    const statusEl = document.getElementById("status");
    const maxTokensEl = document.getElementById("maxTokens");
    const temperatureEl = document.getElementById("temperature");
    const topKEl = document.getElementById("topK");

    let sessionPromise = null;
    let tokenizerPromise = null;
    let metadataPromise = null;
    let mode = "continue";
    let chatHistory = [];

    function assertHttpPage() {
      if (location.protocol === "file:") {
        throw new Error("请通过 HTTP/HTTPS 打开本页，例如 GitHub Pages 地址；浏览器不允许 file:// 页面加载 ONNX 和 tokenizer。");
      }
    }

    function bytesToUnicodeMap() {
      const bs = [];
      for (let i = 33; i <= 126; i++) bs.push(i);
      for (let i = 161; i <= 172; i++) bs.push(i);
      for (let i = 174; i <= 255; i++) bs.push(i);
      const cs = bs.slice();
      let n = 0;
      for (let b = 0; b <= 255; b++) {
        if (!bs.includes(b)) {
          bs.push(b);
          cs.push(256 + n);
          n += 1;
        }
      }
      const byteToChar = new Map();
      const charToByte = new Map();
      for (let i = 0; i < bs.length; i++) {
        const ch = String.fromCodePoint(cs[i]);
        byteToChar.set(bs[i], ch);
        charToByte.set(ch, bs[i]);
      }
      return { byteToChar, charToByte };
    }

    function getPairs(word) {
      const pairs = [];
      for (let i = 0; i < word.length - 1; i++) {
        pairs.push([word[i], word[i + 1]]);
      }
      return pairs;
    }

    class ByteLevelBPE {
      constructor(payload) {
        this.vocab = payload.model.vocab;
        this.idToToken = [];
        for (const [token, id] of Object.entries(this.vocab)) this.idToToken[id] = token;
        this.unkId = this.vocab["<unk>"];
        this.bosId = this.vocab["<bos>"];
        this.eosId = this.vocab["<eos>"];
        this.specialIds = new Set([
          this.vocab["<pad>"],
          this.vocab["<unk>"],
          this.vocab["<bos>"],
          this.vocab["<eos>"],
        ]);
        this.ranks = new Map();
        payload.model.merges.forEach((merge, index) => {
          this.ranks.set(`${merge[0]}\u0001${merge[1]}`, index);
        });
        const maps = bytesToUnicodeMap();
        this.byteToChar = maps.byteToChar;
        this.charToByte = maps.charToByte;
        this.encoder = new TextEncoder();
        this.decoder = new TextDecoder("utf-8", { fatal: false });
        this.cache = new Map();
        this.pattern = /'s|'t|'re|'ve|'m|'ll|'d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+/gu;
      }

      encode(text, addBos = true) {
        const ids = addBos ? [this.bosId] : [];
        const chunks = text.match(this.pattern) || [];
        for (const chunk of chunks) {
          let token = "";
          for (const byte of this.encoder.encode(chunk)) token += this.byteToChar.get(byte);
          for (const piece of this.bpe(token)) ids.push(this.vocab[piece] ?? this.unkId);
        }
        return ids;
      }

      specialId(token) {
        return this.vocab[token];
      }

      bpe(token) {
        if (this.cache.has(token)) return this.cache.get(token);
        let word = Array.from(token);
        if (word.length <= 1) {
          this.cache.set(token, word);
          return word;
        }

        while (true) {
          let bestPair = null;
          let bestRank = Infinity;
          for (const pair of getPairs(word)) {
            const rank = this.ranks.get(`${pair[0]}\u0001${pair[1]}`);
            if (rank !== undefined && rank < bestRank) {
              bestPair = pair;
              bestRank = rank;
            }
          }
          if (bestPair === null) break;

          const nextWord = [];
          for (let i = 0; i < word.length; i++) {
            if (i < word.length - 1 && word[i] === bestPair[0] && word[i + 1] === bestPair[1]) {
              nextWord.push(word[i] + word[i + 1]);
              i += 1;
            } else {
              nextWord.push(word[i]);
            }
          }
          word = nextWord;
          if (word.length === 1) break;
        }

        this.cache.set(token, word);
        return word;
      }

      decode(ids) {
        const bytes = [];
        for (const id of ids) {
          if (this.specialIds.has(id)) continue;
          const token = this.idToToken[id];
          if (token === undefined) continue;
          for (const ch of Array.from(token)) {
            const byte = this.charToByte.get(ch);
            if (byte !== undefined) bytes.push(byte);
          }
        }
        return this.decoder.decode(new Uint8Array(bytes));
      }
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isChat = mode === "chat";
      continuePanelEl.classList.toggle("hidden", isChat);
      chatPanelEl.classList.toggle("hidden", !isChat);
      historyTurnsLabelEl.classList.toggle("hidden", !isChat);
      clearChatButtonEl.classList.toggle("hidden", !isChat);
      continueModeButtonEl.classList.toggle("active", !isChat);
      chatModeButtonEl.classList.toggle("active", isChat);
      continueModeButtonEl.setAttribute("aria-selected", String(!isChat));
      chatModeButtonEl.setAttribute("aria-selected", String(isChat));
      buttonEl.textContent = isChat ? "发送" : "续写";
    }

    function appendRolePrefix(tokenizer, ids, roleToken) {
      const roleId = tokenizer.specialId(roleToken);
      if (roleId === undefined) throw new Error(`tokenizer 缺少特殊 token: ${roleToken}`);
      ids.push(roleId);
      ids.push(...tokenizer.encode(": ", false));
    }

    function encodeChatPrompt(tokenizer, systemPrompt, history, userText, addBos = true) {
      const ids = addBos ? [tokenizer.bosId] : [];
      appendRolePrefix(tokenizer, ids, "<system>");
      ids.push(...tokenizer.encode(systemPrompt.trim(), false));
      for (const item of history) {
        ids.push(...tokenizer.encode("\n", false));
        appendRolePrefix(tokenizer, ids, "<usr>");
        ids.push(...tokenizer.encode(item.user.trim(), false));
        ids.push(...tokenizer.encode("\n", false));
        appendRolePrefix(tokenizer, ids, "<agent>");
        ids.push(tokenizer.bosId);
        ids.push(...tokenizer.encode(item.assistant.trim(), false));
        ids.push(tokenizer.eosId);
      }
      ids.push(...tokenizer.encode("\n", false));
      appendRolePrefix(tokenizer, ids, "<usr>");
      ids.push(...tokenizer.encode(userText.trim(), false));
      ids.push(...tokenizer.encode("\n", false));
      appendRolePrefix(tokenizer, ids, "<agent>");
      ids.push(tokenizer.bosId);
      return ids;
    }

    function decodeChatResponse(tokenizer, generatedIds) {
      const stopIds = new Set([
        tokenizer.eosId,
        tokenizer.specialId("<usr>"),
        tokenizer.specialId("<agent>"),
        tokenizer.specialId("<system>"),
      ]);
      const trimmed = [];
      for (const id of generatedIds) {
        if (stopIds.has(id)) break;
        trimmed.push(id);
      }
      if (trimmed.length > 0 && trimmed[0] === tokenizer.bosId) trimmed.shift();
      return tokenizer.decode(trimmed).trim();
    }

    function renderChat() {
      chatLogEl.textContent = "";
      for (const item of chatHistory) {
        chatLogEl.appendChild(createMessage("user", "用户", item.user));
        chatLogEl.appendChild(createMessage("assistant", "助手", item.assistant));
      }
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    function createMessage(kind, role, text) {
      const row = document.createElement("div");
      row.className = `message ${kind}`;
      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role;
      const bubbleEl = document.createElement("div");
      bubbleEl.className = "bubble";
      bubbleEl.textContent = text;
      row.append(roleEl, bubbleEl);
      return row;
    }

    async function loadEverything() {
      assertHttpPage();
      buttonEl.disabled = true;
      if (!metadataPromise) {
        metadataPromise = fetch(METADATA_URL)
          .then((response) => {
            if (!response.ok) throw new Error(`加载 metadata 失败: ${response.status}`);
            return response.json();
          });
      }
      if (!tokenizerPromise) {
        tokenizerPromise = fetch(TOKENIZER_URL)
          .then((response) => {
            if (!response.ok) throw new Error(`加载 tokenizer 失败: ${response.status}`);
            return response.json();
          })
          .then((payload) => new ByteLevelBPE(payload));
      }
      if (!sessionPromise) {
        sessionPromise = ort.InferenceSession.create(MODEL_URL);
      }
      const [metadata, tokenizer, session] = await Promise.all([metadataPromise, tokenizerPromise, sessionPromise]);
      buttonEl.disabled = false;
      statusEl.textContent = "模型已加载。";
      return { metadata, tokenizer, session };
    }

    function softmaxSample(logits, temperature, topK) {
      const scaled = [];
      const safeTemperature = Math.max(temperature, 0.0001);
      for (let i = 0; i < logits.length; i++) scaled.push([i, logits[i] / safeTemperature]);
      scaled.sort((a, b) => b[1] - a[1]);
      const candidates = topK > 0 ? scaled.slice(0, Math.min(topK, scaled.length)) : scaled;
      const maxLogit = candidates[0][1];
      let total = 0;
      for (const item of candidates) {
        item[2] = Math.exp(item[1] - maxLogit);
        total += item[2];
      }
      let r = Math.random() * total;
      for (const item of candidates) {
        r -= item[2];
        if (r <= 0) return item[0];
      }
      return candidates[candidates.length - 1][0];
    }

    async function runTokenLoop({ ids, maxNewTokens, temperature, topK, metadata, tokenizer, session, onToken, stopIds }) {
      const blockSize = Number(metadata.block_size) || 10000;
      const generatedIds = [];

      for (let step = 0; step < maxNewTokens; step++) {
        const context = ids.slice(Math.max(0, ids.length - blockSize));
        const input = new ort.Tensor("int64", BigInt64Array.from(context.map(BigInt)), [1, context.length]);
        const outputs = await session.run({ input_ids: input });
        const logitsTensor = outputs.logits;
        const vocabSize = logitsTensor.dims[2];
        const offset = (logitsTensor.dims[1] - 1) * vocabSize;
        const nextLogits = logitsTensor.data.slice(offset, offset + vocabSize);
        const nextId = softmaxSample(nextLogits, temperature, topK);
        ids.push(nextId);
        generatedIds.push(nextId);
        if (onToken) onToken(nextId, step + 1, generatedIds);
        await new Promise((resolve) => requestAnimationFrame(resolve));
        if (stopIds && stopIds.has(nextId)) break;
      }

      return { ids, generatedIds };
    }

    async function generateContinuation() {
      const { metadata, tokenizer, session } = await loadEverything();
      buttonEl.disabled = true;
      const maxNewTokens = Math.max(1, Math.min(300, Number(maxTokensEl.value) || 80));
      const temperature = Number(temperatureEl.value) || 0.9;
      const topK = Math.max(0, Math.floor(Number(topKEl.value) || 0));
      let ids = tokenizer.encode(promptEl.value, true);
      const originalLength = ids.length;

      try {
        await runTokenLoop({
          ids,
          maxNewTokens,
          temperature,
          topK,
          metadata,
          tokenizer,
          session,
          stopIds: new Set([tokenizer.eosId]),
          onToken(nextId, count) {
            promptEl.value += tokenizer.decode([nextId]);
            statusEl.textContent = `已生成 ${count} / ${maxNewTokens} token`;
          },
        });
        const generated = tokenizer.decode(ids.slice(originalLength));
        if (generated && !promptEl.value.endsWith(generated)) {
          promptEl.value = tokenizer.decode(ids);
        }
        statusEl.textContent = "续写完成。";
      } finally {
        buttonEl.disabled = false;
      }
    }

    async function generateChat() {
      const userText = chatInputEl.value.trim();
      if (!userText) return;

      const { metadata, tokenizer, session } = await loadEverything();
      buttonEl.disabled = true;
      const maxNewTokens = Math.max(1, Math.min(300, Number(maxTokensEl.value) || 80));
      const temperature = Number(temperatureEl.value) || 0.9;
      const topK = Math.max(0, Math.floor(Number(topKEl.value) || 0));
      const historyTurns = Math.max(0, Math.floor(Number(historyTurnsEl.value) || 0));
      const visibleHistory = chatHistory.slice(Math.max(0, chatHistory.length - historyTurns));
      const ids = encodeChatPrompt(tokenizer, systemPromptEl.value, visibleHistory, userText, true);
      const assistantMessage = { user: userText, assistant: "" };
      chatHistory.push(assistantMessage);
      chatInputEl.value = "";
      renderChat();

      try {
        const result = await runTokenLoop({
          ids,
          maxNewTokens,
          temperature,
          topK,
          metadata,
          tokenizer,
          session,
          stopIds: new Set([tokenizer.eosId]),
          onToken(_nextId, count, generatedIds) {
            assistantMessage.assistant = decodeChatResponse(tokenizer, generatedIds);
            renderChat();
            statusEl.textContent = `已生成 ${count} / ${maxNewTokens} token`;
          },
        });
        const answer = decodeChatResponse(tokenizer, result.generatedIds) || tokenizer.decode(result.generatedIds).trim();
        assistantMessage.assistant = answer;
        renderChat();
        statusEl.textContent = "回复完成。";
      } finally {
        buttonEl.disabled = false;
      }
    }

    async function generate() {
      if (mode === "chat") {
        await generateChat();
      } else {
        await generateContinuation();
      }
    }

    buttonEl.addEventListener("click", () => {
      generate().catch((error) => {
        console.error(error);
        statusEl.textContent = error.message || String(error);
        buttonEl.disabled = false;
      });
    });

    continueModeButtonEl.addEventListener("click", () => setMode("continue"));
    chatModeButtonEl.addEventListener("click", () => setMode("chat"));
    clearChatButtonEl.addEventListener("click", () => {
      chatHistory = [];
      renderChat();
      statusEl.textContent = "对话已清空。";
    });
    chatInputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        generate().catch((error) => {
          console.error(error);
          statusEl.textContent = error.message || String(error);
          buttonEl.disabled = false;
        });
      }
    });

    setMode("continue");
    loadEverything().catch((error) => {
      console.error(error);
      statusEl.textContent = error.message || String(error);
      buttonEl.disabled = false;
    });
  </script>
</body>
</html>
